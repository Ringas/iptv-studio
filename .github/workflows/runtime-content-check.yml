name: 核对两版保留组件内容完全一致
on:
  push:
    branches: ['audit/runtime-slim-20261118']
    paths: ['.github/workflows/runtime-content-check.yml']
permissions:
  contents: read
jobs:
  contents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取已发布镜像并逐文件核对
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifests={}
          code='''import hashlib,json,os
          from pathlib import Path
          files={}
          for folder in ('/usr','/etc','/app'):
              for p in Path(folder).rglob('*'):
                  if str(p) in ('/etc/hosts','/etc/hostname','/etc/resolv.conf'):continue
                  if p.is_symlink():files[str(p)]={'link':os.readlink(p)}
                  elif p.is_file():files[str(p)]={'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          print(json.dumps(files,sort_keys=True))'''
          for label,image in [('baseline','talktoo/iptv-studio:v1.1.3'),('candidate','talktoo/iptv-studio:slim-test-55f8cf7')]:
              subprocess.run(['docker','pull',image],check=True)
              manifests[label]=json.loads(subprocess.check_output(['docker','run','--rm','--network','none','--read-only','--entrypoint','python3',image,'-c',code]))
          a,b=manifests['baseline'],manifests['candidate']
          added=sorted(set(b)-set(a));removed=sorted(set(a)-set(b));changed=sorted(k for k in set(a)&set(b) if a[k]!=b[k])
          result={'added':added,'removed':removed,'changed':changed,'manifests':manifests}
          Path('content-comparison.json').write_text(json.dumps(result,indent=2))
          assert not added,added
          assert changed==['/app/service.py','/app/style.css','/app/ui.js'],changed
          for name in ('node','ffmpeg','python3.13'):assert a['/usr/local/bin/'+name]==b['/usr/local/bin/'+name]
          print(json.dumps({'added':len(added),'removed':len(removed),'changed':changed,'retained_runtime_files_identical':True},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-content-comparison
          path: content-comparison.json
