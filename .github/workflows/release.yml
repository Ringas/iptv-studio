name: 验证并发布正式版本
on:
  push:
    branches: [main]
    paths: ['.github/release-version', '.github/release-validation.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 已验证的稳定版本
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: iptv-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      IMAGE: talktoo/iptv-studio
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 核对候选验证与代码一致性
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          record=json.loads(Path('.github/release-validation.json').read_text())
          tag=os.environ.get('EVENT_TAG') or Path('.github/release-version').read_text().splitlines()[0]
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag) and tag==record['tag']
          assert re.fullmatch(r'[0-9a-f]{40}',record['source_sha']) and type(record['run_id']) is int
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"TAG={tag}\nVERIFIED_SHA={record['source_sha']}\nVERIFIED_RUN={record['run_id']}\n")
          PY
      - name: 取得通过完整回归的同一份压缩镜像
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" > /tmp/run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/run.json'))
          assert r['conclusion']=='success' and r['head_sha']==os.environ['VERIFIED_SHA']
          assert r['path'].split('@')[0]=='.github/workflows/release-candidate.yml'
          PY
          git merge-base --is-ancestor "$VERIFIED_SHA" HEAD
          mapfile -t runtime < <(sed -n 's/^!//p' .dockerignore)
          git diff --exit-code "$VERIFIED_SHA" HEAD -- .dockerignore "${runtime[@]}" scripts 'verify*'
          gh run download "$VERIFIED_RUN" --name release-candidate --dir /tmp/candidate
          test "$(cat /tmp/candidate/VERIFIED_SOURCE)" = "$VERIFIED_SHA"
          cd /tmp/candidate
          sed 's@ .*/gzip-9.tar@  gzip-9.tar@' IMAGE_SHA256SUMS | sha256sum -c -
          sha256sum -c SHA256SUMS
      - name: 再验压缩镜像
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
          skopeo copy oci-archive:/tmp/candidate/gzip-9.tar "docker-daemon:$IMAGE:$TAG"
          python3 scripts/package_release.py "$TAG" /tmp/package-check
          python3 scripts/smoke_image.py "$IMAGE:$TAG" /tmp/package-check/context
      - name: 发布压缩版本镜像并拉取复核
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$HUB_TOKEN" | skopeo login --username talktoo --password-stdin docker.io
          trap 'skopeo logout docker.io >/dev/null' EXIT
          python3 - <<'PYCODE'
          import json,tarfile
          from pathlib import Path
          with tarfile.open('/tmp/candidate/gzip-9.tar') as t:
              def doc(d):return json.load(t.extractfile('blobs/sha256/'+d['digest'].split(':')[1]))
              def select(d):
                  v=doc(d)
                  if 'config' in v:
                      c=doc(v['config'])
                      if (c.get('os'),c.get('architecture'))==('linux','amd64'):yield c
                  else:
                      for child in v.get('manifests',[]):yield from select(child)
              configs=[c for d in json.load(t.extractfile('index.json'))['manifests'] for c in select(d)]
              assert len(configs)==1
              Path('/tmp/expected-config.json').write_text(json.dumps(configs[0]))
          Path('/tmp/verify-pulled.py').write_text("""import json,subprocess,sys
          expected=json.load(open('/tmp/expected-config.json'))
          actual=json.loads(subprocess.check_output(['docker','image','inspect',sys.argv[1]]))[0]
          assert actual['RootFS']['Layers']==expected['rootfs']['diff_ids'],'拉取后原始层摘要变化'
          for key,value in expected['config'].items():
              assert actual['Config'].get(key)==value,(key,actual['Config'].get(key),value)
          assert (actual['Os'],actual['Architecture'])==('linux','amd64')
          print('仓库镜像原始层与运行配置核对通过')
          """)
          PYCODE
          source_digest=$(skopeo inspect --raw oci-archive:/tmp/candidate/gzip-9.tar | sha256sum | cut -d' ' -f1)
          if skopeo inspect --raw "docker://$IMAGE:$TAG" > /tmp/existing-manifest.json 2>/dev/null; then
            test "$source_digest" = "$(sha256sum /tmp/existing-manifest.json | cut -d' ' -f1)" || { echo '::error::版本标签已有不同镜像，拒绝覆盖'; exit 1; }
          else
            skopeo copy --all --preserve-digests oci-archive:/tmp/candidate/gzip-9.tar "docker://$IMAGE:$TAG"
          fi
          docker image rm "$IMAGE:$TAG"
          docker pull --platform linux/amd64 "$IMAGE:$TAG"
          python3 /tmp/verify-pulled.py "$IMAGE:$TAG"
          python3 scripts/smoke_image.py "$IMAGE:$TAG" /tmp/package-check/context
      - name: 发布中文 Release 与精简运行包
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo '::error::Release 已存在，不覆盖旧版本'; exit 1; fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "频谱 IPTV Studio $TAG" --notes-file "docs/release-notes-$TAG.md"
          gh release upload "$TAG" /tmp/candidate/iptv-studio-*.zip /tmp/candidate/SHA256SUMS /tmp/candidate/COMPRESSION.json
          gh release edit "$TAG" --draft=false --latest
      - name: 无重压缩同步 latest 并再次复核
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$HUB_TOKEN" | skopeo login --username talktoo --password-stdin docker.io
          trap 'skopeo logout docker.io >/dev/null' EXIT
          skopeo copy --all --preserve-digests "docker://$IMAGE:$TAG" "docker://$IMAGE:latest"
          version_digest=$(skopeo inspect --raw "docker://$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)
          latest_digest=$(skopeo inspect --raw "docker://$IMAGE:latest" | sha256sum | cut -d' ' -f1)
          test "$version_digest" = "$latest_digest"
          docker pull --platform linux/amd64 "$IMAGE:latest"
          python3 /tmp/verify-pulled.py "$IMAGE:latest"
          python3 scripts/smoke_image.py "$IMAGE:latest" /tmp/package-check/context
