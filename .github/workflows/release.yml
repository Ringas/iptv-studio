name: 验证并发布正式版本
on:
  push:
    branches: [main]
    paths: ['.github/release-version']
  workflow_dispatch:
    inputs:
      tag:
        description: 要验证并发布的稳定版本（例如 v1.1.1）
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: iptv-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      IMAGE: talktoo/iptv-studio
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 核对版本与发布凭证
        env:
          EVENT_TAG: ${{ inputs.tag }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$(head -n 1 .github/release-version)}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ -n "$HUB_TOKEN" ]] || { echo '::error::缺少 DOCKERHUB_TOKEN 发布凭证'; exit 1; }
          test -f "docs/release-notes-$tag.md"
          if sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            [[ "$sha" == "$(git rev-parse HEAD)" ]] || { echo '::error::版本标签已指向其他提交'; exit 1; }
          fi
          python3 scripts/docker_hub.py check
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/iptv-release" >> "$GITHUB_ENV"
      - name: 安装测试用解码器
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: 验证全部隔离回归
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/verify_release.py
      - name: 生成精简运行包与虚构数据演示
        run: |
          python3 scripts/package_release.py "$TAG" "$OUT"
          python3 scripts/build_demo.py
      - name: 构建并验证 linux/amd64 镜像
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" --label "org.opencontainers.image.version=$TAG" --label "org.opencontainers.image.licenses=GPL-3.0-only" -t "$IMAGE:$TAG" "$OUT/context"
          python3 scripts/smoke_image.py "$IMAGE:$TAG" "$OUT/context"
      - name: 保存已验证的运行包
        uses: actions/upload-artifact@v4
        with:
          name: verified-runtime-${{ env.TAG }}
          path: |
            ${{ env.OUT }}/iptv-studio-*.zip
            ${{ env.OUT }}/SHA256SUMS
          retention-days: 14
      - name: 推送已验证的版本镜像
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$HUB_TOKEN" | docker login -u talktoo --password-stdin
          trap 'docker logout >/dev/null' EXIT
          docker push "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG"
      - name: 发布已验证的 GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]] || { echo '::error::正式版本已发布，不覆盖现有文件'; exit 1; }
          else
            gh release create "$TAG" --draft --target "$(git rev-parse HEAD)" --title "频谱 IPTV Studio $TAG" --notes-file "docs/release-notes-$TAG.md"
          fi
          gh release upload "$TAG" "$OUT"/iptv-studio-*.zip "$OUT/SHA256SUMS" --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file "docs/release-notes-$TAG.md"
      - name: 更新 Docker Hub latest 标签
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$(gh release view --json tagName --jq .tagName)" == "$TAG" ]]
          printf '%s' "$HUB_TOKEN" | docker login -u talktoo --password-stdin
          trap 'docker logout >/dev/null' EXIT
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          docker buildx imagetools inspect "$IMAGE:latest"
      - name: 同步 Docker Hub 中文项目说明
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/docker_hub.py update
